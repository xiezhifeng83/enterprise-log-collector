# Development Environment Configuration

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/logdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/log-monitor
          jwk-set-uri: http://localhost:8180/realms/log-monitor/protocol/openid-connect/certs

logging:
  level:
    root: INFO
    com.logcollector: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/application-dev.log
    max-size: 10MB
    max-history: 7

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

elasticsearch:
  uris: http://localhost:9200
  username: elastic
  password: changeme

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  secure: false

log-collection:
  enabled: true
  default-interval: 10000  # 10 seconds for faster dev testing
  ssh:
    timeout: 30000

alerting:
  enabled: true
  email:
    smtp:
      host: localhost
      port: 1025

# Development helper settings
debug: false
server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always
