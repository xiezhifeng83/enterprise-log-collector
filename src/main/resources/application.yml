spring:
  application:
    name: enterprise-log-collector

  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:logdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATABASE_USERNAME:loguser}
    password: ${DATABASE_PASSWORD:logpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LogCollectorHikariPool

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: ${DATABASE_NAME:logdb}

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
        compression.type: lz4
        batch.size: 32768
        linger.ms: 50
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      group-id: log-collector-group
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        specific.avro.reader: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/log-monitor}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/log-monitor/protocol/openid-connect/certs}

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.logcollector: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "[%d{ISO8601}] [%X{correlationId}] [%X{service}] [%-5level] [%logger{36}] - %msg%n"
    file: "[%d{ISO8601}] [%X{correlationId}] [%X{service}] [%-5level] [%logger{36}] - %msg%n"

# Application-specific Configuration
log-collection:
  enabled: true
  default-interval: 30000
  default-batch-size: 500
  parallel-collection: true
  thread-pool-size: 10
  ssh:
    timeout: 60000
    retry-times: 3
    retry-delay: 5000
  kafka:
    topics:
      raw-logs: log-raw-topic
      processed-logs: log-processed-topic
      alerts: alert-topic
      transaction-events: transaction-event-topic
      archive-requests: archive-request-topic

# Elasticsearch Configuration
elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  username: ${ELASTICSEARCH_USERNAME:elastic}
  password: ${ELASTICSEARCH_PASSWORD:changeme}
  connection-timeout: 5000
  socket-timeout: 60000
  index:
    log-entries: log-entries
    number-of-shards: 5
    number-of-replicas: 1

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    archive: archive
  secure: false

# Alert Configuration
alerting:
  enabled: true
  throttle-ttl-minutes: 60
  auto-resolve-hours: 24
  email:
    enabled: true
    from: ${ALERT_EMAIL_FROM:alerts@logcollector.com}
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:1025}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      starttls: false
  webhook:
    enabled: true
    timeout: 5000
    retry-times: 2

# Archive Configuration
archiving:
  enabled: true
  cutoff-days: 30
  compression-enabled: true
  schedule-cron: "0 0 2 * * ?" # Daily at 2 AM
  batch-size: 1000
